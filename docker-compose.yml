services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: settle
      POSTGRES_PASSWORD: settle
      POSTGRES_DB: settle
    ports:
      - "5434:5432"
    volumes:
      - settle-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U settle -d settle"]
      interval: 2s
      timeout: 2s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgres://settle:settle@db:5432/settle
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  settle-db:
